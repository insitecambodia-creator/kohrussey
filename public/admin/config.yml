# Settings for the blog editor at /admin/ (Sveltia CMS; same format as Decap CMS).
# Posts are Markdown files in src/content/blog; the fields below must match src/content.config.ts.
backend:
  name: github
  repo: insitecambodia-creator/kohrussey
  # No `branch`: changes go to the repository's default branch, which is the one the site is built from.
  commit_messages:
    create: 'Add blog post "{{slug}}"'
    update: 'Update blog post "{{slug}}"'
    delete: 'Delete blog post "{{slug}}"'
    uploadMedia: 'Upload "{{path}}"'
    deleteMedia: 'Delete "{{path}}"'

site_url: https://www.kohrusseyresort.com
display_url: https://www.kohrusseyresort.com
locale: en

# Photos are saved in src/assets/blog, with the site's other images (the site resizes them when it is built).
media_folder: src/assets/blog

collections:
  - name: blog
    label: Blog posts
    label_singular: Blog post
    folder: src/content/blog
    extension: md
    format: frontmatter
    create: true
    # In a post, a photo is written as a path relative to the post's own file: from src/content/blog to src/assets/blog.
    media_folder: ../../assets/blog
    public_folder: ../../assets/blog
    # The file name, and so the web address (/blog/<name>/), comes from the title. It cannot be changed here afterwards.
    slug: "{{slug}}"
    preview_path: "blog/{{slug}}/"
    summary: "{{title}}"
    sortable_fields:
      fields: [date, title]
      default:
        field: date
        direction: Descending
    fields:
      - label: Title
        name: title
        widget: string
        hint: The headline on the page (H1). Also the title shown in Google unless "Search title" is filled in.
      - label: Search title
        name: seoTitle
        widget: string
        required: false
        hint: The exact title for Google and browser tabs, about 50 to 60 characters. Leave empty to use the Title followed by "| Koh Russey Resort".
      - label: Meta description
        name: description
        widget: text
        hint: Shown under the title in Google. Aim for 120 to 160 characters.
        pattern: ["^[\\s\\S]{50,200}$", "Use between 50 and 200 characters"]
      - label: Publication date
        name: date
        widget: datetime
        format: YYYY-MM-DD
        date_format: YYYY-MM-DD
        time_format: false
      - label: Last updated
        name: updated
        widget: datetime
        format: YYYY-MM-DD
        date_format: YYYY-MM-DD
        time_format: false
        required: false
        hint: Only when the post is changed in a meaningful way. Shown on the post and in the sitemap.
      - label: Cover photo
        name: cover
        widget: image
        required: false
        choose_url: false
        hint: Also used for social media previews (cropped to 1200x630). At least 1600 pixels wide.
      - label: Cover photo description
        name: coverAlt
        widget: string
        required: false
        hint: Alt text. Required when there is a cover photo.
      - label: Tags
        name: tags
        widget: list
        required: false
        default: []
      - label: Draft (hidden from the site)
        name: draft
        widget: boolean
        default: true
        hint: Switch off to publish the post.
      - label: Hide from search engines
        name: noindex
        widget: boolean
        default: false
        required: false
      - label: Canonical address
        name: canonical
        widget: string
        required: false
        hint: Only for a post first published on another site (the full address of the original).
      - label: Body
        name: body
        widget: markdown
